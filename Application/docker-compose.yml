services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/ticketing
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports: ["4000:4000"]
    depends_on: [mongo, mailpit]

  # Not runnable until the web screens land: docker compose --profile web up
  web:
    profiles: [web]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  mongo-data:
